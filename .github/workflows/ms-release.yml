name: ms-release

# Builds, signs and publishes one mattstack fork build, v<base>-ms.<N>, from a
# mattstack/<base> branch. Runs only by hand. Its build job runs on the
# herdr-signer runner, whose job-started hook refuses every other workflow and event.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build, mattstack/<upstream version>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ms-release
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  BRANCH: ${{ inputs.branch }}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.version.outputs.base }}
      revision: ${{ steps.version.outputs.revision }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      newest_base: ${{ steps.version.outputs.newest_base }}
    steps:
      - name: Check the branch name
        run: |
          case "$BRANCH" in
            mattstack/[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::branch must be mattstack/<upstream version>, not $BRANCH"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Pick the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          [ "$BRANCH" = "mattstack/$base" ] || { echo "::error::$BRANCH builds herdr $base; expected branch mattstack/$base"; exit 1; }
          tags="$(gh release list -R "$REPO" --limit 1000 --json tagName --jq '.[].tagName')"
          pattern="$(printf '%s' "$base" | sed 's/\./\\./g')"
          last="$(printf '%s\n' "$tags" | sed -n "s/^v$pattern-ms\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)"
          revision=$(( ${last:-0} + 1 ))
          newest_base="$(printf '%s\n' "$tags" | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)-ms\.[0-9][0-9]*$/\1/p' | sort -V | tail -1)"
          if [ -n "$newest_base" ] && [ "$(printf '%s\n%s\n' "$base" "$newest_base" | sort -V | tail -1)" != "$base" ]; then
            echo "::error::herdr $newest_base is already published; a $base build would move everyone back. Build mattstack/$newest_base or newer."
            exit 1
          fi
          {
            echo "base=$base"
            echo "revision=$revision"
            echo "version=$base-ms.$revision"
            echo "sha=$(git rev-parse HEAD)"
            echo "newest_base=${newest_base:-$base}"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing herdr $base-ms.$revision from $BRANCH at $(git rev-parse --short HEAD)"

  # The only job on the signing Mac. Build code runs here, so nothing here gets a
  # token that can push to the branch or publish.
  build:
    needs: version
    runs-on: herdr-signer
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      REVISION: ${{ needs.version.outputs.revision }}
      VERSION: ${{ needs.version.outputs.version }}
    outputs:
      arm64_sha256: ${{ steps.hashes.outputs.arm64 }}
      x86_64_sha256: ${{ steps.hashes.outputs.x86_64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rust toolchain and targets
        run: |
          set -euo pipefail
          # From the checkout, so these land on the toolchain rust-toolchain.toml pins.
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build
        run: |
          set -euo pipefail
          ms/build.sh --arch arm64 --revision "$REVISION" --out dist
          ms/build.sh --arch x86_64 --revision "$REVISION" --out dist

      - name: Sign and notarize
        run: |
          set -euo pipefail
          # The key is root-only; the root-owned helper signs with hardened runtime
          # and Apple's timestamp, then notarizes (ms/runner/README.md).
          sudo -n /usr/local/herdr-signer/sign.sh "$PWD/dist/herdr-macos-aarch64" "$PWD/dist/herdr-macos-x86_64"

      - name: Verify signatures, notarization, architectures and version
        run: |
          set -euo pipefail
          for pair in herdr-macos-aarch64:arm64 herdr-macos-x86_64:x86_64; do
            asset="${pair%%:*}"; arch="${pair#*:}"
            ms/verify-release.sh "dist/$asset" "$arch"
          done
          case "$(uname -m)" in
            arm64) native=herdr-macos-aarch64 ;;
            *) native=herdr-macos-x86_64 ;;
          esac
          reported="$(env -i HOME="$(mktemp -d)" PATH=/usr/bin:/bin "dist/$native" --version)"
          want="herdr $VERSION"
          [ "$reported" = "$want" ] || { echo "::error::$native reports '$reported', expected '$want'"; exit 1; }

      - name: Report the hashes
        id: hashes
        run: |
          set -euo pipefail
          arm64="$(shasum -a 256 dist/herdr-macos-aarch64 | cut -d' ' -f1)"
          x86_64="$(shasum -a 256 dist/herdr-macos-x86_64 | cut -d' ' -f1)"
          {
            echo "arm64=$arm64"
            echo "x86_64=$x86_64"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: |
            dist/herdr-macos-aarch64
            dist/herdr-macos-x86_64
          if-no-files-found: error
          retention-days: 1

  # On a fresh machine that runs no build: the only job that can write.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BASE: ${{ needs.version.outputs.base }}
      REVISION: ${{ needs.version.outputs.revision }}
      SHA: ${{ needs.version.outputs.sha }}
      NEWEST_BASE: ${{ needs.version.outputs.newest_base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: dist

      - name: Check the binaries are the ones the build hashed
        env:
          ARM64_SHA256: ${{ needs.build.outputs.arm64_sha256 }}
          X86_64_SHA256: ${{ needs.build.outputs.x86_64_sha256 }}
        run: |
          set -euo pipefail
          for hash in "$ARM64_SHA256" "$X86_64_SHA256"; do
            [[ "$hash" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the build reported no hash for a binary"; exit 1; }
          done
          printf '%s  dist/herdr-macos-aarch64\n%s  dist/herdr-macos-x86_64\n' "$ARM64_SHA256" "$X86_64_SHA256" | shasum -a 256 -c -

      - name: Write manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$(gh release list -R "$REPO" --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')" ]; then
            gh release download -R "$REPO" --pattern herdr-builds.json --dir previous
            previous=previous/herdr-builds.json
          else
            previous=none
          fi
          cat > notes.md <<EOF
          herdr $VERSION (mattstack fork), built from \`$BRANCH\` at $SHA.

          This build is not made or endorsed by herdr's maintainers. See the [README](https://github.com/$REPO#readme) for what it changes.
          EOF
          ms/manifests.sh --version "$VERSION" --base "$BASE" --revision "$REVISION" \
            --arm64 dist/herdr-macos-aarch64 --x86_64 dist/herdr-macos-x86_64 \
            --previous "$previous" --notes notes.md --out dist
          for asset in herdr-macos-aarch64 herdr-macos-x86_64; do
            (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
          done
          cp LICENSE dist/LICENSE

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" -R "$REPO" --target "$SHA" --latest \
            --title "herdr $VERSION (mattstack fork)" --notes-file notes.md \
            dist/herdr-macos-aarch64 dist/herdr-macos-x86_64 \
            dist/herdr-macos-aarch64.sha256 dist/herdr-macos-x86_64.sha256 \
            dist/LICENSE dist/herdr-builds.json dist/latest.json

      - name: Default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          newest="$(printf '%s\n%s\n' "$BASE" "$NEWEST_BASE" | sort -V | tail -1)"
          current="$(gh repo view "$REPO" --json defaultBranchRef --jq .defaultBranchRef.name)"
          if [ "$newest" = "$BASE" ] && [ "$current" != "$BRANCH" ]; then
            echo "::warning::$BRANCH is now the newest base. Make it the default branch (the job's token cannot): gh repo edit $REPO --default-branch $BRANCH"
          fi
