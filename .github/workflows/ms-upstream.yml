name: ms-upstream

# Nightly: when herdrdev/herdr tags a new stable release, rebase the fork
# commits onto it, test, and open an issue. Never publishes: ms-release.yml
# does that, run by hand from the command in the issue.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ms-upstream
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  UPSTREAM: https://github.com/herdrdev/herdr.git

jobs:
  # Most nights find nothing new; this needs no macOS runner.
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      action: ${{ steps.find.outputs.action }}
      source: ${{ steps.find.outputs.source }}
      current: ${{ steps.find.outputs.current }}
      newest: ${{ steps.find.outputs.newest }}
    steps:
      - name: Find the newest upstream release
        id: find
        run: |
          set -euo pipefail
          origin="https://github.com/$REPO.git"
          source="$(git ls-remote --heads "$origin" 'mattstack/*' | sed -n 's|.*refs/heads/\(mattstack/[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$|\1|p' | sort -V | tail -1)"
          [ -n "$source" ] || { echo "::error::no mattstack/<version> branch"; exit 1; }
          current="${source#mattstack/}"
          newest="$(git ls-remote --tags --refs "$UPSTREAM" 'v*' | sed -n 's|.*refs/tags/v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$|\1|p' | sort -V | tail -1)"
          echo "fork base $current (from $source); upstream newest $newest"
          if [ "$(printf '%s\n%s\n' "$current" "$newest" | sort -V | tail -1)" = "$current" ]; then
            echo "Nothing newer than $current upstream."
            echo "action=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git ls-remote --exit-code --heads "$origin" "mattstack/$newest" >/dev/null; then
            echo "mattstack/$newest already exists."
            echo "action=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "action=rebase"
            echo "source=$source"
            echo "current=$current"
            echo "newest=$newest"
          } >> "$GITHUB_OUTPUT"

  # Runs upstream's build and test code, so this job gets no token: that code
  # could leave a hook or a tool behind for a later step here.
  candidate:
    needs: find
    if: needs.find.outputs.action == 'rebase'
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      code: ${{ steps.rebase.outputs.code }}
      tree: ${{ steps.rebase.outputs.tree }}
      detail: ${{ steps.rebase.outputs.detail }}
      failed: ${{ steps.test.outputs.failed }}
      test_outcome: ${{ steps.test.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase onto the new release
        id: rebase
        env:
          SOURCE: ${{ needs.find.outputs.source }}
          CURRENT: ${{ needs.find.outputs.current }}
          NEWEST: ${{ needs.find.outputs.newest }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git fetch -q --no-tags "$UPSTREAM" "refs/tags/v$CURRENT:refs/tags/v$CURRENT" "refs/tags/v$NEWEST:refs/tags/v$NEWEST"
          git switch -q "$SOURCE"
          code=0
          ms/rebase-onto.sh "v$NEWEST" 2> rebase.err || code=$?
          cat rebase.err >&2
          delimiter="ms-upstream-$(openssl rand -hex 16)"
          tree=""
          [ "$code" != 0 ] || tree="$(git rev-parse "mattstack/$NEWEST^{tree}")"
          {
            echo "code=$code"
            echo "tree=$tree"
            echo "detail<<$delimiter"
            cat rebase.err
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: steps.rebase.outputs.code == '0'
        with:
          version: 0.16.0

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        if: steps.rebase.outputs.code == '0'
        with:
          tool: nextest

      - name: Test
        id: test
        if: steps.rebase.outputs.code == '0'
        run: |
          set -uo pipefail
          failed=""
          cargo nextest run --locked --no-fail-fast > nextest.log 2>&1 || failed="cargo nextest run --locked"
          tail -40 nextest.log
          for t in ms/tests/*.sh; do
            bash "$t" > "$t.log" 2>&1 || failed="${failed:+$failed, }$t"
            tail -5 "$t.log"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

  # On a fresh machine, where no upstream code has run: rebases again and pushes
  # only the tree the candidate job tested.
  push:
    needs: [find, candidate]
    if: needs.candidate.outputs.code == '0' && needs.candidate.outputs.test_outcome == 'success' && needs.candidate.outputs.failed == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase onto the new release
        env:
          SOURCE: ${{ needs.find.outputs.source }}
          CURRENT: ${{ needs.find.outputs.current }}
          NEWEST: ${{ needs.find.outputs.newest }}
          TESTED_TREE: ${{ needs.candidate.outputs.tree }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git fetch -q --no-tags "$UPSTREAM" "refs/tags/v$CURRENT:refs/tags/v$CURRENT" "refs/tags/v$NEWEST:refs/tags/v$NEWEST"
          git switch -q "$SOURCE"
          ms/rebase-onto.sh "v$NEWEST"
          tree="$(git rev-parse "mattstack/$NEWEST^{tree}")"
          [ "$tree" = "$TESTED_TREE" ] || { echo "::error::this rebase gave tree $tree, but the candidate job tested $TESTED_TREE"; exit 1; }

      - name: Push the candidate branch
        id: push
        env:
          # The default token cannot push a branch whose new upstream commits
          # change .github/workflows. MS_PUSH_TOKEN: a fine-grained token for
          # m4ttstack/herdr only, with Contents and Workflows write.
          PUSH_TOKEN: ${{ secrets.MS_PUSH_TOKEN || github.token }}
          NEWEST: ${{ needs.find.outputs.newest }}
        run: |
          set -uo pipefail
          if git push -q "https://x-access-token:${PUSH_TOKEN}@github.com/$REPO.git" "mattstack/$NEWEST" 2> push.err; then
            echo "pushed=yes" >> "$GITHUB_OUTPUT"
          else
            cat push.err >&2
            echo "pushed=no" >> "$GITHUB_OUTPUT"
          fi

  # On a fresh machine from the fork's own branch: the candidate job's machine
  # ran upstream's build code, which could have changed any file or tool there.
  report:
    needs: [find, candidate, push]
    if: always() && needs.find.outputs.action == 'rebase'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.find.outputs.source }}
          persist-credentials: false

      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ needs.find.outputs.current }}
          NEWEST: ${{ needs.find.outputs.newest }}
          REBASE_CODE: ${{ needs.candidate.outputs.code }}
          REBASE_DETAIL: ${{ needs.candidate.outputs.detail }}
          FAILED: ${{ needs.candidate.outputs.failed }}
          TEST_OUTCOME: ${{ needs.candidate.outputs.test_outcome }}
          PUSHED: ${{ needs.push.outputs.pushed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ms/upstream-issue.sh
